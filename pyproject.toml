[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-web-gpt"
version = "0.1.0"
description = "A small MCP and CLI interface to a dedicated ChatGPT web session"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.25,<2", "playwright>=1.58,<2"]

[project.urls]
Repository = "https://github.com/dengfeng-0908/codex-web-gpt"
Issues = "https://github.com/dengfeng-0908/codex-web-gpt/issues"

[project.scripts]
web-gpt = "web_gpt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_gpt"]
